<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCulture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <pattern id="batik" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="14" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.2"/>
      <circle cx="60" cy="0" r="10" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.2"/>
      <circle cx="0" cy="60" r="10" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.2"/>
      <circle cx="60" cy="60" r="10" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.2"/>
    </pattern>
    <filter id="shadowCulture" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bgCulture)"/>
  <rect width="800" height="533" fill="url(#batik)"/>

  <!-- Traditional Gunungan / Javanese Motif Silhouette -->
  <g transform="translate(350, 100)" filter="url(#shadowCulture)">
    <path d="M50 0 C50 0, 0 80, 0 160 C0 220, 25 240, 50 240 C75 240, 100 220, 100 160 C100 80, 50 0, 50 0 Z" fill="#f59e0b" opacity="0.8"/>
    <!-- Tree of Life motif inside Gunungan -->
    <path d="M50 230 L50 40 M50 140 Q25 120 15 110 M50 120 Q75 100 85 90 M50 170 Q30 155 20 150 M50 160 Q70 145 80 140" stroke="#78350f" stroke-width="3" fill="none"/>
  </g>

  <!-- Banner Overlay Card -->
  <rect x="50" y="400" width="700" height="100" rx="16" fill="#0f172a" fill-opacity="0.85" filter="url(#shadowCulture)"/>
  <rect x="50" y="400" width="700" height="100" rx="16" fill="none" stroke="#e879f9" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon & Label -->
  <text x="85" y="442" font-size="32">🎭</text>
  <text x="135" y="438" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Budaya &amp; Tradisi Desa</text>
  <text x="135" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f0abfc">Adat Jawa Mataraman, Bersih Desa &amp; Seni Lokal • Desa Ngariboyo</text>
  <text x="135" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Ganti file ini dengan foto asli: budaya-tradisi.jpg / budaya-tradisi.png</text>
</svg>
