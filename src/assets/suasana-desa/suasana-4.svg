<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="skySuasana4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="embungWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadowSuasana4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#skySuasana4)"/>
  
  <!-- Reservoir Embankment & Hills -->
  <path d="M0 240 Q300 190 800 230 L800 533 L0 533 Z" fill="#15803d"/>
  
  <!-- Embung Water -->
  <path d="M0 280 Q400 260 800 280 L800 533 L0 533 Z" fill="url(#embungWater)"/>
  <ellipse cx="380" cy="330" rx="260" ry="8" fill="#38bdf8" opacity="0.4"/>
  <ellipse cx="450" cy="365" rx="200" ry="6" fill="#7dd3fc" opacity="0.5"/>

  <!-- Gazebo / Joglo by the lake -->
  <g transform="translate(620, 230)">
    <polygon points="30,10 5,30 55,30" fill="#78350f"/>
    <rect x="10" y="30" width="4" height="25" fill="#451a03"/>
    <rect x="46" y="30" width="4" height="25" fill="#451a03"/>
    <rect x="5" y="55" width="50" height="6" fill="#94a3b8"/>
  </g>

  <!-- Info Overlay Card -->
  <rect x="50" y="415" width="700" height="85" rx="14" fill="#0f172a" fill-opacity="0.85" filter="url(#shadowSuasana4)"/>
  <rect x="50" y="415" width="700" height="85" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="80" y="452" font-size="28">🏞️</text>
  <text x="125" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Suasana 4: Panorama Wisata Embung Pendem Ngariboyo</text>
  <text x="125" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Ganti file ini dengan foto asli: suasana-4.jpg / suasana-4.png</text>
</svg>
