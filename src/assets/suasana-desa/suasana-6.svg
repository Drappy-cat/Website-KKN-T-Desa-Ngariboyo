      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <filter id="shadowSuasana6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#skySuasana6)"/>
  
  <!-- Trees along road -->
  <circle cx="100" cy="240" r="90" fill="#15803d"/>
  <circle cx="170" cy="260" r="70" fill="#166534"/>
  <circle cx="700" cy="240" r="90" fill="#15803d"/>
  <circle cx="630" cy="260" r="70" fill="#166534"/>

  <!-- Country road receding to vanishing point -->
  <polygon points="400,260 405,260 520,533 280,533" fill="#475569"/>
  <!-- Road center stripes -->
  <polygon points="399,280 401,280 402,310 398,310" fill="#facc15"/>
  <polygon points="398,330 402,330 404,380 396,380" fill="#facc15"/>
  <polygon points="396,405 404,405 408,480 392,480" fill="#facc15"/>

  <!-- Grass verges -->
  <polygon points="0,320 400,260 280,533 0,533" fill="#65a30d"/>
  <polygon points="800,320 405,260 520,533 800,533" fill="#65a30d"/>

  <!-- Info Overlay Card -->
  <rect x="50" y="415" width="700" height="85" rx="14" fill="#0f172a" fill-opacity="0.85" filter="url(#shadowSuasana6)"/>
  <rect x="50" y="415" width="700" height="85" rx="14" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="80" y="452" font-size="28">🛤️</text>
  <text x="125" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Suasana 6: Jalan &amp; Sudut Asri Pedesaan Ngariboyo</text>
