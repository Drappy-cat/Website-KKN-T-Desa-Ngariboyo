<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="skySuasana1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadowSuasana1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#skySuasana1)"/>
  <circle cx="680" cy="110" r="50" fill="#fef08a" opacity="0.9"/>
  
  <!-- Mount Lawu outline -->
  <path d="M150 320 L380 130 L610 320 Z" fill="#047857" opacity="0.6"/>
  <!-- Green Paddy slopes -->
  <path d="M0 290 Q220 230 480 290 T800 270 L800 533 L0 533 Z" fill="url(#hill1)"/>
  <path d="M0 350 Q260 290 520 350 T800 330 L800 533 L0 533 Z" fill="#65a30d"/>
  <path d="M0 420 Q240 370 500 420 T800 400 L800 533 L0 533 Z" fill="#84cc16" opacity="0.8"/>

  <!-- Info Overlay Card -->
  <rect x="50" y="415" width="700" height="85" rx="14" fill="#0f172a" fill-opacity="0.85" filter="url(#shadowSuasana1)"/>
  <rect x="50" y="415" width="700" height="85" rx="14" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="80" y="452" font-size="28">🌄</text>
  <text x="125" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Suasana 1: Lanskap Persawahan &amp; Kaki Gunung Lawu</text>
  <text x="125" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Ganti file ini dengan foto asli: suasana-1.jpg / suasana-1.png</text>
