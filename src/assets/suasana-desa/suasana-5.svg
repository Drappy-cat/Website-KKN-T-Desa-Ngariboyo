<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="skySuasana5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadowSuasana5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#skySuasana5)"/>
  
  <!-- Park / Open Field Scene -->
  <circle cx="200" cy="220" r="90" fill="#14532d" opacity="0.6"/>
  <circle cx="290" cy="200" r="110" fill="#166534" opacity="0.7"/>
  <circle cx="580" cy="220" r="100" fill="#14532d" opacity="0.6"/>

  <path d="M0 320 Q400 300 800 320 L800 533 L0 533 Z" fill="#16a34a"/>
  <path d="M0 380 Q400 360 800 380 L800 533 L0 533 Z" fill="#15803d"/>

  <!-- Figures Working Together Silhouette -->
  <g transform="translate(360, 260)" fill="#0f172a">
    <!-- Person 1 -->
    <circle cx="15" cy="15" r="8"/>
    <path d="M5 45 L15 28 L25 45 L20 65 L10 65 Z"/>
    <!-- Person 2 -->
    <circle cx="55" cy="12" r="8"/>
    <path d="M45 42 L55 25 L65 42 L60 65 L50 65 Z"/>
    <!-- Connecting tool/bar -->
    <line x1="20" y1="40" x2="50" y2="40" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Info Overlay Card -->
  <rect x="50" y="415" width="700" height="85" rx="14" fill="#0f172a" fill-opacity="0.85" filter="url(#shadowSuasana5)"/>
  <rect x="50" y="415" width="700" height="85" rx="14" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="80" y="452" font-size="28">🤝</text>
  <text x="125" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Suasana 5: Gotong Royong &amp; Kebersamaan Warga Desa</text>
  <text x="125" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Ganti file ini dengan foto asli: suasana-5.jpg / suasana-5.png</text>
</svg>
